[project]
name = "webservice-hidro"
version = "0.2.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mvcastro", email = "mvcastro1975@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.2",
    "pandas>=3.0.0",
    "requests>=2.32.5",
]

[project.scripts]
webservice-hidro = "webservice_hidro:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
]

[tool.pyright]
stubPath = "./typings"